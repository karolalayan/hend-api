services:
  app:
    build: .
    image: hend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hend_api_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
      - "4333:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - hend_api_network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-hend_db}
      MYSQL_USER: ${DB_USERNAME:-hend_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hend_pass}
    ports:
      - "6015:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hend_api_network

networks:
  hend_api_network:

volumes:
  dbdata:
